<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>公益活動｜台灣國際拼布友好會 TIQA</title>
  <meta name="description" content="台灣國際拼布友好會公益活動與歷年公益紀錄。">

  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/charity.css">

  <script src="/assets/js/head-common.js"></script>
</head>

<body>

<div id="site-header"></div>

<nav id="breadcrumb" class="breadcrumb" aria-label="麵包屑"></nav>

<main>

  <!-- Hero -->
  <section class="charity-hero">
    <img src="./hero.jpg" alt="" class="charity-hero-image">
    <div class="charity-hero-overlay"></div>

    <div class="content-container charity-hero-content">
      <h1>公益活動</h1>
      <p>Charity &amp; Community</p>
    </div>
  </section>


  <!-- Introduction -->
  <section class="charity-intro">
    <div class="content-container">

      <p class="charity-label">TIQA Charity</p>

      <h2>以拼布傳遞友好與關懷</h2>

      <p class="charity-intro-text">
        拼布不只是創作，也承載著分享與餽贈的精神。
        這裡記錄台灣國際拼布友好會參與及發起的公益活動。
      </p>

    </div>
  </section>


  <!-- 進行中 -->
  <section class="charity-list-section">

    <div class="content-container">

      <div class="charity-group" id="charity-current-group">

        <div class="charity-group-title">
          <span>Current Activities</span>
          <h2>進行中</h2>
        </div>

        <div id="charity-current" class="charity-list"></div>

      </div>


      <!-- 已結束 -->
      <div class="charity-group" id="charity-ended-group">

        <div class="charity-group-title">
          <span>Past Activities</span>
          <h2>已結束</h2>
        </div>

        <div id="charity-ended" class="charity-list"></div>

      </div>

    </div>

  </section>

</main>


<div id="site-footer"></div>


<script src="/assets/js/include.js"></script>
