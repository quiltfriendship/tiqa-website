<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>台灣國際拼布友好會 TIQA</title>

    <meta name="description"
          content="台灣國際拼布友好會 Taiwan International Quilt Association 官方網站">


    <!-- =================================================
         全站共用 CSS
    ================================================= -->

    <link rel="stylesheet"
          href="/assets/css/style.css">


    <!-- =================================================
         共用 HEAD
         Favicon / Apple Touch Icon / Manifest
    ================================================= -->

    <script src="/assets/js/head-common.js"></script>

</head>


<body>


    <!-- =====================================================
         共用 Header
    ===================================================== -->

    <div id="site-header"></div>

    <!-- =====================================================
         Breadcrumb
    ===================================================== -->

    <nav id="breadcrumb"
         class="breadcrumb"
         aria-label="麵包屑">
    </nav>

    <!-- =====================================================
         Main
    ===================================================== -->

    <main>


        <!-- =================================================
             Hero 主視覺
        ================================================= -->

        <section class="hero hero-carousel" aria-label="首頁主視覺輪播">

            <div class="hero-carousel-track">

                <div class="hero-slide is-active" data-hero-slide aria-hidden="false">
                    <div class="hero-image-wrap">
                        <img src="/assets/images/hero.jpg"
                             alt=""
                             class="hero-image">
                        <div class="hero-overlay"></div>
                        <div class="hero-title">
                            <h1>台 灣 國 際 拼 布 友 好 會</h1>
                            <p class="english-name">Taiwan International Quilt Association</p>
                        </div>
                    </div>
                </div>

                <div class="hero-slide" data-hero-slide aria-hidden="true">
                    <a href="/events/2026/"
                       class="hero-event-link"
                       aria-label="前往 2026 曬被節活動頁面">
                        <img src="/assets/images/home-2026-quilt-festival.jpg"
                             alt="2026 曬被節開始報名，活動日期 2026 年 11 月 13 日至 11 月 15 日，報名截止日期 2026 年 10 月 31 日"
                             class="hero-event-image">
                    </a>
                </div>

            </div>

            <button class="hero-carousel-arrow hero-carousel-prev"
                    type="button"
                    aria-label="上一張主視覺">
                <span aria-hidden="true">‹</span>
            </button>

            <button class="hero-carousel-arrow hero-carousel-next"
                    type="button"
                    aria-label="下一張主視覺">
                <span aria-hidden="true">›</span>
            </button>

            <div class="hero-carousel-dots" aria-label="主視覺切換">
                <button type="button" class="hero-carousel-dot is-active" data-hero-dot="0" aria-label="顯示第 1 張主視覺" aria-current="true"></button>
                <button type="button" class="hero-carousel-dot" data-hero-dot="1" aria-label="顯示第 2 張主視覺"></button>
            </div>

        </section>



        
        <!-- =================================================
             2026 當期活動
        ================================================= -->
        <section class="home-current-event" aria-labelledby="home-current-event-title">
            <div class="content-container">
                <p class="home-current-event-label">Current Event</p>
                <div class="home-current-event-layout">
                    <div class="home-current-event-title">
                        <p class="home-current-event-year">2026 曬被節</p>
                        <h2 id="home-current-event-title">第九屆曬被節</h2>
                        <p class="home-current-event-theme">拼布走進大稻埕</p>
                    </div>
                    <div class="home-current-event-info">
                        <p class="home-current-event-date">2026.11.13–11.15</p>
                        <p class="home-current-event-place">永樂廣場・大稻埕碼頭</p>
                        <p class="home-current-event-description">
                            拼布遊行・戶外市集・創作走秀・互動體驗<br>
                            拼布走進街區，作品走成風景。
                        </p>
                        <a href="/events/2026/" class="home-current-event-button">
                            查看 2026 曬被節活動資訊 <span aria-hidden="true">→</span>
                        </a>
                    </div>
                </div>
            </div>
        </section>

        <!-- =================================================
             聯絡我們
        ================================================= -->

        <section class="contact-section">

            <div class="content-container">

                <h2>
                    聯絡我們
                </h2>

                <p>
                    如有相關問題，歡迎與台灣國際拼布友好會聯絡。
                </p>

                <a class="contact-button"
                   href="/about/contact/">
                    聯絡 TIQA
                </a>

            </div>

        </section>


    </main>



    <!-- =====================================================
         共用 Footer
    ===================================================== -->

    <div id="site-footer"></div>



    <!-- =====================================================
         共用 Header / Footer 載入
    ===================================================== -->

    <script src="/assets/js/include.js"></script>
    <script src="/assets/js/main.js"></script>


</body>

</html>
