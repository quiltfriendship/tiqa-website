<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>台灣國際拼布友好會 TIQA</title>

    <meta name="description"
          content="台灣國際拼布友好會 Taiwan International Quilt Association 官方網站">


    <!-- =================================================
         全站共用 CSS
    ================================================= -->

    <link rel="stylesheet"
          href="/assets/css/style.css">


    <!-- =================================================
         共用 HEAD
         Favicon / Apple Touch Icon / Manifest
    ================================================= -->

    <script src="/assets/js/head-common.js"></script>

</head>


<body>


    <!-- =====================================================
         共用 Header
    ===================================================== -->

    <div id="site-header"></div>

    <!-- =====================================================
         Breadcrumb
    ===================================================== -->

    <nav id="breadcrumb"
         class="breadcrumb"
         aria-label="麵包屑">
    </nav>

    <!-- =====================================================
         Main
    ===================================================== -->

    <main>


        <!-- =================================================
             Hero 主視覺
        ================================================= -->

        <section class="hero">

            <div class="hero-image-wrap">

                <img src="/assets/images/hero.jpg"
                     alt=""
                     class="hero-image">


                <div class="hero-overlay"></div>


                <div class="hero-title">

                    <h1>
                        台 灣 國 際 拼 布 友 好 會
                    </h1>

                    <p class="english-name">
                        Taiwan International Quilt Association
                    </p>

                </div>

            </div>

        </section>



        
        <!-- =================================================
             2026 當期活動
        ================================================= -->
        <section class="home-current-event" aria-labelledby="home-current-event-title">
            <div class="content-container">
                <p class="home-current-event-label">Current Event</p>
                <div class="home-current-event-layout">
                    <div class="home-current-event-title">
                        <p class="home-current-event-year">2026 曬被節</p>
                        <h2 id="home-current-event-title">第九屆曬被節</h2>
                        <p class="home-current-event-theme">拼布走進大稻埕</p>
                    </div>
                    <div class="home-current-event-info">
                        <p class="home-current-event-date">2026.11.13–11.15</p>
                        <p class="home-current-event-place">永樂廣場・大稻埕碼頭</p>
                        <p class="home-current-event-description">
                            拼布遊行・戶外市集・創作走秀・互動體驗<br>
                            拼布走進街區，作品走成風景。
                        </p>
                        <a href="/events/2026/" class="home-current-event-button">
                            查看 2026 曬被節活動資訊 <span aria-hidden="true">→</span>
                        </a>
                    </div>
                </div>
            </div>
        </section>

        <!-- =================================================
             聯絡我們
        ================================================= -->

        <section class="contact-section">

            <div class="content-container">

                <h2>
                    聯絡我們
                </h2>

                <p>
                    如有相關問題，歡迎與台灣國際拼布友好會聯絡。
                </p>

                <a class="contact-button"
                   href="/about/contact/">
                    聯絡 TIQA
                </a>

            </div>

        </section>


    </main>



    <!-- =====================================================
         共用 Footer
    ===================================================== -->

    <div id="site-footer"></div>



    <!-- =====================================================
         共用 Header / Footer 載入
    ===================================================== -->

    <script src="/assets/js/include.js"></script>


</body>

</html>
