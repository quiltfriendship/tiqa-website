<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>歷年活動｜台灣國際拼布友好會 TIQA</title>

    <meta name="description"
          content="台灣國際拼布友好會歷年活動，包含友好拼布手作節、展覽、工作坊與相關活動紀錄。">

    <!-- 全站共用 CSS -->
    <link rel="stylesheet"
          href="/assets/css/style.css">

    <!-- 歷年活動專用 CSS -->
    <link rel="stylesheet"
          href="/assets/css/events.css">
    <script src="/assets/js/head-common.js"></script>
</head>


<body>


<!-- =====================================================
     共用 Header
===================================================== -->

<div id="site-header"></div>



<!-- =====================================================
     Main
===================================================== -->

<main>


    <!-- =================================================
         Page Hero
    ================================================= -->

    <section class="events-hero">

        <div class="content-container">

            <h1>
                歷年活動
            </h1>

            <p>
                Past Events
            </p>

        </div>

    </section>



    <!-- =================================================
         Intro
    ================================================= -->

    <section class="events-intro">

        <div class="content-container">

            <div class="events-section-heading">

                <p class="events-label">
                    Taiwan Friendly Quilt & Craft Festival
                </p>

                <h2>
                    一起回顧我們走過的拼布時光
                </h2>

            </div>


            <div class="events-intro-content">

                <p>
                    台灣國際拼布友好會持續透過展覽、競賽、
                    工作坊、市集及交流活動，
                    推廣拼布文化並串連不同領域的創作者。
                </p>

                <p>
                    歡迎依年度瀏覽歷屆活動，
                    回顧每一屆友好拼布手作節與相關活動紀錄。
                </p>

            </div>

        </div>

    </section>



    <!-- =================================================
         年度活動
         由 events.js 依 eventsData 自動產生
    ================================================= -->

    <section class="events-list-section">

        <div class="content-container">

            <div class="events-section-heading">

                <p class="events-label">
                    Event Archive
                </p>

                <h2>
                    歷屆活動
                </h2>

            </div>


            <div id="events-list"
                 class="events-grid">

                <!-- events.js 自動產生 -->

            </div>

        </div>

    </section>


</main>



<!-- =====================================================
     共用 Footer
===================================================== -->

<div id="site-footer"></div>



<!-- =====================================================
     JavaScript
===================================================== -->

<script src="/assets/js/include.js"></script>

<script src="/events/events-data.js"></script>

<script src="/events/events.js"></script>


</body>
</html>
