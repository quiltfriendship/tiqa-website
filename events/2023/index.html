<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>2023 友好拼布手作節｜台灣國際拼布友好會 TIQA</title>

    <meta name="description"
          content="2023 友好拼布手作節活動紀錄，包含作品展、拼布大賽、主題作品募集、會員徵件及參展攤位等內容。">


    <!-- 全站共用 CSS -->
    <link rel="stylesheet"
          href="/assets/css/style.css">


    <!-- 共用 HEAD -->
    <script src="/assets/js/head-common.js"></script>


    <style>

        /* =====================================================
           2023 首頁主標題區
           將原本「頁面標題」＋「介紹」整合為同一區
        ===================================================== */

        .event-year-header {
            padding: 48px 20px 42px;

            background: #f8f3f4;

            text-align: center;
        }


        .event-year-header h1 {
            margin: 0;

            color: #444;

            font-size: 32px;
            font-weight: 400;

            line-height: 1.5;

            letter-spacing: 0.12em;
        }


        .event-year-header-subtitle {
            position: relative;

            display: inline-block;

            margin: 8px 0 0;

            padding-bottom: 17px;

            color: #888;

            font-size: 14px;

            line-height: 1.6;

            letter-spacing: 0.05em;
        }


        .event-year-header-subtitle::after {
            content: "";

            position: absolute;

            left: 50%;
            bottom: 0;

            width: 42px;
            height: 2px;

            background: #b98d96;

            transform: translateX(-50%);
        }



        /* =====================================================
           活動介紹＋主視覺
        ===================================================== */

        .event-overview {
            padding: 55px 0 65px;

            background: #fff;
        }


        .event-overview-card {
            display: grid;

            grid-template-columns:
                minmax(260px, 0.8fr)
                minmax(0, 1.2fr);

            gap: 55px;

            align-items: center;

            max-width: 960px;

            margin: 0 auto;

            padding: 28px;

            background: #faf8f8;

            border-radius: 6px;
        }


        .event-overview-image {
            display: flex;

            align-items: center;
            justify-content: center;
        }


        .event-overview-image img {
            display: block;

            width: auto;

            max-width: 100%;
            max-height: 430px;

            object-fit: contain;
        }


        .event-overview-content h2 {
            margin: 0 0 20px;

            color: #444;

            font-size: 28px;
            font-weight: 400;

            line-height: 1.5;

            letter-spacing: 0.1em;
        }


        .event-overview-content p {
            margin: 0;

            color: #666;

            font-size: 18px;

            line-height: 2;
        }



        /* =====================================================
           共用章節標題
        ===================================================== */

        .event-section-heading {
            position: relative;

            margin-bottom: 38px;

            padding-bottom: 20px;

            text-align: center;
        }


        .event-section-heading::after {
            content: "";

            position: absolute;

            left: 50%;
            bottom: 0;

            width: 42px;
            height: 2px;

            background: #b98d96;

            transform: translateX(-50%);
        }


        .event-section-label {
            margin: 0 0 7px;

            color: #a98a91;

            font-size: 12px;

            line-height: 1.5;

            letter-spacing: 0.14em;
        }


        .event-section-heading h2 {
            margin: 0;

            color: #3f3f3f;

            font-size: 28px;
            font-weight: 500;

            line-height: 1.5;

            letter-spacing: 0.12em;
        }



        /* =====================================================
           作品展
        ===================================================== */

        .event-exhibition {
            padding: 55px 0 75px;

            background: #faf8f8;
        }


        .event-exhibition-card {
            display: grid;

            grid-template-columns:
                minmax(300px, 1.15fr)
                minmax(280px, 0.85fr);

            gap: 45px;

            align-items: center;

            max-width: 960px;

            margin: 0 auto;

            padding: 22px;

            border: 1px solid #e4dcde;

            background: #fff;
        }


        .event-exhibition-image {
            overflow: hidden;

            background: #f3f3f3;
        }


        .event-exhibition-image img {
            display: block;

            width: 100%;

            aspect-ratio: 16 / 10;

            object-fit: cover;

            transition:
                transform 0.35s ease;
        }


        .event-exhibition-card:hover
        .event-exhibition-image img {
            transform: scale(1.02);
        }


        .event-exhibition-content {
            padding-right: 15px;
        }


        .event-exhibition-label {
            margin: 0 0 7px;

            color: #b18a92;

            font-size: 12px;

            line-height: 1.5;

            letter-spacing: 0.14em;
        }


        .event-exhibition-content h3 {
            margin: 0 0 15px;

            color: #444;

            font-size: 25px;
            font-weight: 500;

            line-height: 1.5;

            letter-spacing: 0.08em;
        }


        .event-exhibition-description {
            margin: 0 0 24px;

            color: #666;

            font-size: 14px;

            line-height: 1.9;
        }


        .event-exhibition-button {
            display: inline-block;

            padding: 10px 24px;

            border: 1px solid #9b6f78;

            color: #fff;

            background: #9b6f78;

            font-size: 14px;

            text-decoration: none;

            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                transform 0.2s ease;
        }


        .event-exhibition-button:hover {
            background: #7f5962;

            border-color: #7f5962;

            transform: translateY(-1px);
        }



        /* =====================================================
           活動紀錄
        ===================================================== */

        .event-archive {
            padding: 65px 0 90px;

            background: #fff;
        }


        .event-archive-grid {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 18px;

            max-width: 960px;

            margin: 0 auto;
        }


        .event-archive-card {
            display: flex;

            flex-direction: column;

            min-height: 190px;

            padding: 23px 24px;

            border: 1px solid #e6e0e2;

            background: #fff;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                border-color 0.25s ease;
        }


        .event-archive-card:hover {
            transform: translateY(-3px);

            border-color: #d9c6ca;

            box-shadow:
                0 8px 22px
                rgba(0, 0, 0, 0.05);
        }


        .event-archive-label {
            margin: 0 0 6px;

            color: #b18a92;

            font-size: 11px;

            line-height: 1.5;

            letter-spacing: 0.12em;
        }


        .event-archive-card h3 {
            margin: 0 0 10px;

            color: #444;

            font-size: 19px;
            font-weight: 500;

            line-height: 1.5;

            letter-spacing: 0.04em;
        }


        .event-archive-description {
            margin: 0 0 18px;

            color: #666;

            font-size: 13px;

            line-height: 1.8;
        }


        .event-archive-link {
            display: inline-block;

            align-self: flex-start;

            margin-top: auto;

            padding-bottom: 2px;

            border-bottom: 1px solid #b98d96;

            color: #91656f;

            font-size: 13px;

            text-decoration: none;
        }


        .event-archive-link:hover {
            color: #6f4851;

            border-color: #6f4851;
        }



        /* =====================================================
           返回歷年活動
        ===================================================== */

        .event-year-back {
            padding: 40px 0 50px;

            background: #faf8f8;

            text-align: center;
        }


        .event-year-back a {
            display: inline-block;

            padding: 9px 22px;

            border: 1px solid #aaa;

            color: #555;

            background: #fff;

            font-size: 14px;

            text-decoration: none;
        }


        .event-year-back a:hover {
            color: #fff;

            border-color: #8f656f;

            background: #8f656f;
        }



        /* =====================================================
           Tablet
        ===================================================== */

        @media (max-width: 850px) {

            .event-overview-card,
            .event-exhibition-card {
                grid-template-columns:
                    1fr;

                gap: 28px;
            }


            .event-overview-image img {
                max-height: 500px;
            }


            .event-exhibition-content {
                padding-right: 0;
            }

        }



        /* =====================================================
           Mobile
        ===================================================== */

        @media (max-width: 650px) {

            .event-year-header {
                padding:
                    38px 18px 34px;
            }


            .event-year-header h1 {
                font-size: 26px;

                letter-spacing: 0.08em;
            }


            .event-overview {
                padding:
                    35px 0 50px;
            }


            .event-overview-card {
                padding: 18px;
            }


            .event-overview-content h2 {
                font-size: 23px;
            }


            .event-overview-content p {
                font-size: 16px;
            }


            .event-section-heading {
                margin-bottom: 30px;

                padding-bottom: 17px;
            }


            .event-section-heading h2 {
                font-size: 24px;
            }


            .event-exhibition {
                padding:
                    50px 0 60px;
            }


            .event-exhibition-card {
                padding: 16px;
            }


            .event-exhibition-content h3 {
                font-size: 22px;
            }


            .event-archive {
                padding:
                    50px 0 65px;
            }


            .event-archive-grid {
                grid-template-columns:
                    1fr;

                gap: 14px;
            }


            .event-archive-card {
                min-height: 0;

                padding:
                    21px 20px;
            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     共用 Header
===================================================== -->

<div id="site-header"></div>


<!-- =====================================================
     Breadcrumb
===================================================== -->

<nav id="breadcrumb"
     class="breadcrumb"
     aria-label="麵包屑">
</nav>


<main>


    <!-- =================================================
         年度標題
    ================================================= -->

    <section class="event-year-header">

        <div class="content-container">

            <h1 id="event-title">
                2023 友好拼布手作節
            </h1>

            <p id="event-header-subtitle"
               class="event-year-header-subtitle">
                在松菸1號倉庫
            </p>

        </div>

    </section>



    <!-- =================================================
         主視覺＋介紹
         原本兩個紅框區合併在這裡
    ================================================= -->

    <section class="event-overview">

        <div class="content-container">

            <article class="event-overview-card">

                <div class="event-overview-image">

                    <img id="event-image"
                         src="/events/2023/2023.jpg"
                         alt="2023 友好拼布手作節">

                </div>


                <div class="event-overview-content">

                    <h2 id="event-overview-title">
                        2023 友好拼布手作節
                    </h2>

                    <p id="event-description">
                    </p>

                </div>

            </article>

        </div>

    </section>



    <!-- =================================================
         作品展
    ================================================= -->

    <section class="event-exhibition">

        <div class="content-container">

            <div class="event-section-heading">

                <p class="event-section-label">
                    Exhibition
                </p>

                <h2>
                    作品展
                </h2>

            </div>


            <article class="event-exhibition-card">

                <div class="event-exhibition-image">

                    <img id="exhibition-image"
                         src="/events/2023/exhibition.jpg"
                         alt="2023 作品展">

                </div>


                <div class="event-exhibition-content">

                    <p id="exhibition-description"
                       class="event-exhibition-description">
                    </p>

                    <a id="exhibition-link"
                       href="/events/2023/exhibition/"
                       class="event-exhibition-button">

                        瀏覽作品展 →

                    </a>

                </div>

            </article>

        </div>

    </section>



    <!-- =================================================
         活動紀錄
    ================================================= -->

    <section class="event-archive">

        <div class="content-container">

            <div class="event-section-heading">

                <p class="event-section-label">
                    Event Archive
                </p>

                <h2>
                    活動紀錄
                </h2>

            </div>


            <div id="event-section-list"
                 class="event-archive-grid">

                <!-- JS 自動產生 -->

            </div>

        </div>

    </section>



    <!-- =================================================
         返回歷年活動
    ================================================= -->

    <section class="event-year-back">

        <div class="content-container">

            <a href="/events/">
                ← 返回歷年活動
            </a>

        </div>

    </section>


</main>


<!-- =====================================================
     共用 Footer
===================================================== -->

<div id="site-footer"></div>


<!-- =====================================================
     JavaScript
===================================================== -->

<script src="/assets/js/include.js"></script>


<!-- Breadcrumb DATA -->

<script>

    window.breadcrumbData = [

        {
            title: "首頁",
            url: "/"
        },

        {
            title: "歷年活動",
            url: "/events/"
        },

        {
            title: "2023 友好拼布手作節"
        }

    ];

</script>


<script src="/assets/js/breadcrumb.js"></script>


<!-- 2023 DATA -->

<script src="/events/2023/event-data.js"></script>


<!-- =====================================================
     產生頁面內容
===================================================== -->

<script>

(function () {

    "use strict";


    if (
        typeof eventData === "undefined" ||
        !eventData
    ) {

        console.error(
            "eventData 資料不存在"
        );

        return;

    }


    /* =====================================================
       年度基本資料
    ===================================================== */

    const eventTitle =
        document.getElementById(
            "event-title"
        );


    const eventHeaderSubtitle =
        document.getElementById(
            "event-header-subtitle"
        );


    const eventOverviewTitle =
        document.getElementById(
            "event-overview-title"
        );


    const eventDescription =
        document.getElementById(
            "event-description"
        );


    const eventImage =
        document.getElementById(
            "event-image"
        );


    if (eventTitle) {

        eventTitle.textContent =
            eventData.title || "";

    }


    if (eventHeaderSubtitle) {

        eventHeaderSubtitle.textContent =
            eventData.subtitle || "";

    }


    if (eventOverviewTitle) {

        eventOverviewTitle.textContent =
            eventData.title || "";

    }


    if (eventDescription) {

        eventDescription.textContent =
            eventData.description || "";

    }


    if (eventImage) {

        eventImage.src =
            eventData.image;

        eventImage.alt =
            eventData.title || "";

    }



    /* =====================================================
       作品展
    ===================================================== */

    if (eventData.exhibition) {

        const exhibition =
            eventData.exhibition;


        const exhibitionImage =
            document.getElementById(
                "exhibition-image"
            );


        const exhibitionDescription =
            document.getElementById(
                "exhibition-description"
            );


        const exhibitionLink =
            document.getElementById(
                "exhibition-link"
            );


        if (exhibitionImage) {

            exhibitionImage.src =
                exhibition.image || "";

            exhibitionImage.alt =
                eventData.year +
                " " +
                exhibition.title;

        }


        if (exhibitionDescription) {

            exhibitionDescription.textContent =
                exhibition.description || "";

        }


        if (exhibitionLink) {

            exhibitionLink.href =
                exhibition.url || "#";

        }

    }



    /* =====================================================
       活動紀錄
    ===================================================== */

    const container =
        document.getElementById(
            "event-section-list"
        );


    if (
        !container ||
        !Array.isArray(eventData.sections)
    ) {

        return;

    }


    eventData.sections.forEach(
        function (item) {


            const article =
                document.createElement(
                    "article"
                );


            article.className =
                "event-archive-card";


            /* English */

            const label =
                document.createElement(
                    "p"
                );


            label.className =
                "event-archive-label";


            label.textContent =
                item.englishTitle || "";


            /* Title */

            const heading =
                document.createElement(
                    "h3"
                );


            heading.textContent =
                item.title || "";


            /* Description */

            const description =
                document.createElement(
                    "p"
                );


            description.className =
                "event-archive-description";


            description.textContent =
                item.description || "";


            /* Link */

            const link =
                document.createElement(
                    "a"
                );


            link.href =
                item.url || "#";


            link.className =
                "event-archive-link";


            link.textContent =
                "查看內容 →";


            /* 組合 */

            article.appendChild(
                label
            );


            article.appendChild(
                heading
            );


            article.appendChild(
                description
            );


            article.appendChild(
                link
            );


            container.appendChild(
                article
            );

        }
    );


})();

</script>


</body>

</html>
