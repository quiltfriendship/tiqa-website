<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>參展攤位介紹｜2023 友好拼布手作節｜台灣國際拼布友好會 TIQA</title>

    <meta name="description"
          content="2023 友好拼布手作節參展攤位介紹，包含拼布教室、個人工作室、創作者及相關品牌廠商。">

    <link rel="stylesheet"
          href="/assets/css/style.css">

    <link rel="stylesheet"
          href="/assets/css/events.css">

    <script src="/assets/js/head-common.js"></script>


    <style>

        .exhibitors-hero {
            padding: 48px 20px 42px;
            background: #f8f3f4;
            text-align: center;
        }

        .exhibitors-hero h1 {
            margin: 0;
            color: #444;
            font-size: 32px;
            font-weight: 400;
            line-height: 1.5;
            letter-spacing: 0.1em;
        }

        .exhibitors-hero p {
            position: relative;
            display: inline-block;
            margin: 8px 0 0;
            padding-bottom: 17px;
            color: #999;
            font-size: 13px;
            line-height: 1.6;
            letter-spacing: 0.12em;
        }

        .exhibitors-hero p::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: 0;
            width: 42px;
            height: 2px;
            background: #b98d96;
            transform: translateX(-50%);
        }

        .exhibitors-intro {
            padding: 60px 0 65px;
            background: #fff;
        }

        .exhibitors-intro-content {
            max-width: 880px;
            margin: 0 auto;
        }

        .exhibitors-intro-content h2 {
            margin: 0 0 20px;
            color: #444;
            font-size: 27px;
            font-weight: 500;
            line-height: 1.5;
        }

        .exhibitors-intro-content p {
            margin: 0 0 18px;
            color: #666;
            font-size: 16px;
            line-height: 2;
        }

        .archive-note {
            max-width: 880px;
            margin: 35px auto 0;
            padding: 18px 22px;
            border-left: 3px solid #b98d96;
            background: #faf8f8;
            color: #666;
            font-size: 14px;
            line-height: 1.9;
        }

        .archive-note strong {
            color: #8f656f;
            font-weight: 500;
        }

        .exhibitors-section {
            padding: 70px 0 80px;
        }

        .exhibitors-section.alt {
            background: #faf8f8;
        }

        .exhibitors-heading {
            position: relative;
            margin-bottom: 45px;
            padding-bottom: 20px;
            text-align: center;
        }

        .exhibitors-heading::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: 0;
            width: 42px;
            height: 2px;
            background: #b98d96;
            transform: translateX(-50%);
        }

        .exhibitors-label {
            margin: 0 0 7px;
            color: #a98a91;
            font-size: 12px;
            line-height: 1.5;
            letter-spacing: 0.14em;
        }

        .exhibitors-heading h2 {
            margin: 0;
            color: #444;
            font-size: 28px;
            font-weight: 500;
            line-height: 1.5;
            letter-spacing: 0.1em;
        }

        /* 工作室 / 個人 */
        .studio-list {
            max-width: 1080px;
            margin: 0 auto;
        }

        .studio-card {
            padding: 38px 0;
            border-bottom: 1px solid #e6e0de;
        }

        .studio-card:first-child {
            padding-top: 0;
        }

        .studio-card:last-child {
            border-bottom: 0;
            padding-bottom: 0;
        }

        .studio-card-header {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 10px 18px;
            margin-bottom: 28px;
        }

        .studio-card-title {
            margin: 0;
            color: #455267;
            font-size: 23px;
            font-weight: 500;
            line-height: 1.5;
        }

        .studio-links {
            display: flex;
            flex-wrap: wrap;
            gap: 0;
        }

        .studio-links a {
            color: #a47c84;
            font-size: 13px;
            text-decoration: none;
        }

        .studio-links a + a::before {
            content: "｜";
            margin: 0 7px;
            color: #bbb;
        }

        .studio-links a:hover {
            color: #7c555f;
        }

        .studio-card-body {
            display: grid;
            grid-template-columns:
                minmax(280px, 0.9fr)
                minmax(0, 1.25fr);
            gap: 48px;
            align-items: start;
        }

        .studio-gallery-main {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 360px;
            padding: 14px;
            border: 1px solid #e6e0de;
            background: #fff;
        }

        .studio-gallery-main img {
            display: block;
            width: 100%;
            max-height: 500px;
            object-fit: contain;
        }

        .studio-thumbnails {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .studio-thumbnail {
            width: 72px;
            height: 72px;
            padding: 0;
            overflow: hidden;
            border: 1px solid #ddd;
            background: #fff;
            cursor: pointer;
        }

        .studio-thumbnail img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .studio-thumbnail.is-active {
            border-color: #9b6f78;
            box-shadow: 0 0 0 2px rgba(155,111,120,0.12);
        }

        .studio-description p {
            margin: 0 0 14px;
            color: #666;
            font-size: 15px;
            line-height: 1.95;
        }

        .studio-description p:last-child {
            margin-bottom: 0;
        }

        /* 品牌 */
        .brand-list {
            max-width: 1050px;
            margin: 0 auto;
        }

        .brand-card {
            display: grid;
            grid-template-columns:
                minmax(260px, 0.9fr)
                minmax(0, 1.1fr);
            gap: 48px;
            align-items: center;
            padding: 36px 0;
            border-bottom: 1px solid #e8e2df;
        }

        .brand-card:first-child {
            padding-top: 0;
        }

        .brand-card:last-child {
            padding-bottom: 0;
            border-bottom: 0;
        }

        .brand-card.reverse .brand-media {
            order: 2;
        }

        .brand-card.reverse .brand-content {
            order: 1;
        }

        .brand-media {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 220px;
            padding: 18px;
            background: #fff;
            border: 1px solid #e7e1de;
        }

        .brand-media img {
            display: block;
            width: 100%;
            max-height: 340px;
            object-fit: contain;
        }

        .brand-content h3 {
            margin: 0 0 15px;
            color: #455267;
            font-size: 23px;
            font-weight: 500;
            line-height: 1.5;
        }

        .brand-description {
            margin: 0 0 16px;
            color: #666;
            font-size: 15px;
            line-height: 1.95;
            white-space: pre-line;
        }

        .brand-meta {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .brand-meta li {
            margin-top: 7px;
            color: #777;
            font-size: 13px;
            line-height: 1.8;
        }

        .brand-meta strong {
            color: #8f656f;
            font-weight: 500;
        }

        .exhibitors-empty {
            padding: 40px 25px;
            border: 1px solid #e7e1de;
            background: #fff;
            color: #777;
            text-align: center;
            line-height: 1.9;
        }

        @media (max-width: 850px) {

            .studio-card-body,
            .brand-card,
            .brand-card.reverse {
                grid-template-columns: 1fr;
                gap: 24px;
            }

            .brand-card.reverse .brand-media,
            .brand-card.reverse .brand-content {
                order: initial;
            }

            .studio-gallery-main {
                min-height: 280px;
            }

        }

        @media (max-width: 650px) {

            .exhibitors-hero {
                padding: 38px 18px 34px;
            }

            .exhibitors-hero h1 {
                font-size: 25px;
            }

            .exhibitors-section {
                padding: 50px 0 60px;
            }

            .exhibitors-intro {
                padding: 45px 0 55px;
            }

            .exhibitors-intro-content h2,
            .exhibitors-heading h2 {
                font-size: 23px;
            }

            .studio-card {
                padding: 30px 0;
            }

            .studio-card-title,
            .brand-content h3 {
                font-size: 21px;
            }

            .studio-gallery-main {
                min-height: 220px;
            }

            .studio-thumbnail {
                width: 62px;
                height: 62px;
            }

        }

    </style>

</head>


<body>

<div id="site-header"></div>

<nav id="breadcrumb"
     class="breadcrumb"
     aria-label="麵包屑">
</nav>


<main>

    <section class="exhibitors-hero">

        <h1>
            參展攤位介紹
        </h1>

        <p>
            Exhibitors
        </p>

    </section>


    <section class="exhibitors-intro">

        <div class="content-container">

            <div class="exhibitors-intro-content">

                <h2>
                    2023 友好拼布手作節參展單位
                </h2>

                <p>
                    2023 友好拼布手作節除作品展與相關活動外，
                    亦邀請拼布教室、個人工作室、創作者，
                    以及材料、工具、設備等相關品牌共同參展。
                </p>

                <p>
                    本頁將原網站分開呈現的參展資訊整合為一頁，
                    並依參展性質分為「拼布教室・工作室」與
                    「品牌・相關廠商」兩大類。
                </p>

            </div>

            <div class="archive-note">

                <strong>
                    歷史資料
                </strong>

                ｜本頁為 2023 年友好拼布手作節參展攤位紀錄，
                相關聯絡及販售資訊請以各單位目前公告為準。

            </div>

        </div>

    </section>


    <section class="exhibitors-section alt">

        <div class="content-container">

            <div class="exhibitors-heading">

                <p class="exhibitors-label">
                    Studios &amp; Creators
                </p>

                <h2>
                    拼布教室・工作室
                </h2>

            </div>

            <div id="studio-list"
                 class="studio-list">
            </div>

        </div>

    </section>


    <section class="exhibitors-section">

        <div class="content-container">

            <div class="exhibitors-heading">

                <p class="exhibitors-label">
                    Brands &amp; Vendors
                </p>

                <h2>
                    品牌・相關廠商
                </h2>

            </div>

            <div id="brand-list"
                 class="brand-list">
            </div>

        </div>

    </section>


    <section class="event-return-banner">

        <div class="content-container">

            <a href="/events/2023/"
               class="event-return-banner-link"
               aria-label="返回 2023 友好拼布手作節首頁">

                <img
                    src="/events/2023/event-footer.jpg"
                    alt="2023 友好拼布手作節，2023年11月17日至11月19日，臺北松山文創園區一號倉庫">

            </a>

            <p class="event-return-hint">
                點擊圖片返回 2023 友好拼布手作節
            </p>

        </div>

    </section>

</main>
