<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>2025 友好拼布手作節｜台灣國際拼布友好會 TIQA</title>

    <meta name="description"
          content="2025 友好拼布手作節以青春之歌為主題，活動於臺北松山文創園區1號倉庫與文創大街舉行，包含拼布大賽、主題聯合作品、會員徵件、創意市集、工作坊及文創大街活動。">

    <!-- 全站共用 CSS -->
    <link rel="stylesheet"
          href="/assets/css/style.css">

    <!-- 歷年活動共用 CSS -->
    <link rel="stylesheet"
          href="/assets/css/events.css">

    <script src="/assets/js/head-common.js"></script>


    <style>

        /* =====================================================
           2025 年度標題
        ===================================================== */

        .event-year-header {
            padding: 48px 20px 42px;
            background: #f8f3f4;
            text-align: center;
        }

        .event-year-header h1 {
            margin: 0;
            color: #444;
            font-size: 32px;
            font-weight: 400;
            line-height: 1.5;
            letter-spacing: .12em;
        }

        .event-year-header-subtitle {
            position: relative;
            display: inline-block;
            margin: 8px 0 0;
            padding-bottom: 17px;
            color: #888;
            font-size: 14px;
            line-height: 1.6;
            letter-spacing: .05em;
        }

        .event-year-header-subtitle::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: 0;
            width: 42px;
            height: 2px;
            background: #b98d96;
            transform: translateX(-50%);
        }


        /* =====================================================
           主視覺＋介紹
        ===================================================== */

        .event-overview {
            padding: 55px 0 70px;
            background: #fff;
        }

        .event-overview-card {
            display: grid;
            grid-template-columns:
                minmax(280px, .85fr)
                minmax(0, 1.15fr);
            gap: 55px;
            align-items: center;
            max-width: 980px;
            margin: 0 auto;
            padding: 28px;
            background: #faf8f8;
            border-radius: 6px;
        }

        .event-overview-image {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .event-overview-image img {
            display: block;
            width: auto;
            max-width: 100%;
            max-height: 560px;
            object-fit: contain;
        }

        .event-overview-kicker {
            margin: 0 0 8px;
            color: #b18a92;
            font-size: 12px;
            line-height: 1.5;
            letter-spacing: .14em;
        }

        .event-overview-content h2 {
            margin: 0 0 18px;
            color: #444;
            font-size: 29px;
            font-weight: 400;
            line-height: 1.5;
            letter-spacing: .08em;
        }

        .event-overview-content > p:not(.event-overview-kicker) {
            margin: 0;
            color: #666;
            font-size: 17px;
            line-height: 2;
        }


        /* =====================================================
           活動基本資訊
        ===================================================== */

        .event-facts {
            margin: 30px 0 0;
            padding: 0;
            list-style: none;
            border-top: 1px solid #e5dcde;
        }

        .event-facts li {
            display: grid;
            grid-template-columns: 92px minmax(0, 1fr);
            gap: 18px;
            padding: 11px 0;
            border-bottom: 1px solid #e5dcde;
        }

        .event-facts-label {
            color: #986d76;
            font-size: 13px;
            font-weight: 500;
            line-height: 1.7;
        }

        .event-facts-value {
            color: #555;
            font-size: 14px;
            line-height: 1.7;
        }


        /* =====================================================
           作品展
        ===================================================== */

        .event-exhibition {
            padding: 60px 0 75px;
            background: #fff;
        }

        .event-exhibition-card {
            display: grid;
            grid-template-columns:
                minmax(0, 1.1fr)
                minmax(280px, .9fr);
            gap: 45px;
            align-items: center;
            max-width: 980px;
            margin: 0 auto;
            padding: 22px;
            border: 1px solid #e4dcde;
            background: #fff;
        }

        .event-exhibition-image {
            overflow: hidden;
            background: #f3f3f3;
        }

        .event-exhibition-image img {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 10;
            object-fit: cover;
            transition: transform .35s ease;
        }

        .event-exhibition-card:hover
        .event-exhibition-image img {
            transform: scale(1.02);
        }

        .event-exhibition-content {
            padding: 5px 10px;
        }

        .event-exhibition-description {
            margin: 0 0 24px;
            color: #666;
            font-size: 15px;
            line-height: 1.95;
        }

        .event-exhibition-button {
            display: inline-block;
            padding: 10px 24px;
            border: 1px solid #9b6f78;
            color: #fff;
            background: #9b6f78;
            font-size: 14px;
            text-decoration: none;
            transition:
                background .2s ease,
                border-color .2s ease,
                transform .2s ease;
        }

        .event-exhibition-button:hover {
            background: #7f5962;
            border-color: #7f5962;
            transform: translateY(-1px);
        }


        /* =====================================================
           活動內容
        ===================================================== */

        .event-archive {
            padding: 65px 0 90px;
            background: #faf8f8;
        }

        .event-section-heading {
            position: relative;
            margin-bottom: 38px;
            padding-bottom: 20px;
            text-align: center;
        }

        .event-section-heading::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: 0;
            width: 42px;
            height: 2px;
            background: #b98d96;
            transform: translateX(-50%);
        }

        .event-section-label {
            margin: 0 0 7px;
            color: #a98a91;
            font-size: 12px;
            line-height: 1.5;
            letter-spacing: .14em;
        }

        .event-section-heading h2 {
            margin: 0;
            color: #3f3f3f;
            font-size: 28px;
            font-weight: 500;
            line-height: 1.5;
            letter-spacing: .12em;
        }

        .event-archive-grid {
            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));
            gap: 18px;
            max-width: 960px;
            margin: 0 auto;
        }

        .event-archive-card {
            display: flex;
            flex-direction: column;
            min-height: 190px;
            padding: 23px 24px;
            border: 1px solid #e6e0e2;
            background: #fff;
            transition:
                transform .25s ease,
                box-shadow .25s ease,
                border-color .25s ease;
        }

        .event-archive-card:hover {
            transform: translateY(-3px);
            border-color: #d9c6ca;
            box-shadow: 0 8px 22px rgba(0, 0, 0, .05);
        }

        .event-archive-label {
            margin: 0 0 6px;
            color: #b18a92;
            font-size: 11px;
            line-height: 1.5;
            letter-spacing: .12em;
        }

        .event-archive-card h3 {
            margin: 0 0 10px;
            color: #444;
            font-size: 19px;
            font-weight: 500;
            line-height: 1.5;
            letter-spacing: .04em;
        }

        .event-archive-description {
            margin: 0 0 18px;
            color: #666;
            font-size: 13px;
            line-height: 1.8;
        }

        .event-archive-link {
            display: inline-block;
            align-self: flex-start;
            margin-top: auto;
            padding-bottom: 2px;
            border-bottom: 1px solid #b98d96;
            color: #91656f;
            font-size: 13px;
            text-decoration: none;
        }

        .event-archive-link:hover {
            color: #6f4851;
            border-color: #6f4851;
        }


        /* 最後一張單數卡片 */

        .event-archive-card:last-child:nth-child(odd) {
            grid-column: 1 / -1;
            width: calc(50% - 9px);
        }


        /* =====================================================
           Tablet
        ===================================================== */

        @media (max-width: 850px) {

            .event-overview-card,
            .event-exhibition-card {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .event-overview-image img {
                max-height: 650px;
            }

        }


        /* =====================================================
           Mobile
        ===================================================== */

        @media (max-width: 650px) {

            .event-year-header {
                padding: 38px 18px 34px;
            }

            .event-year-header h1 {
                font-size: 26px;
                letter-spacing: .08em;
            }

            .event-overview {
                padding: 35px 0 50px;
            }

            .event-overview-card {
                padding: 18px;
            }

            .event-overview-content h2 {
                font-size: 23px;
            }

            .event-overview-content > p:not(.event-overview-kicker) {
                font-size: 16px;
            }

            .event-facts li {
                grid-template-columns: 1fr;
                gap: 2px;
            }

            .event-archive {
                padding: 50px 0 65px;
            }

            .event-section-heading {
                margin-bottom: 30px;
                padding-bottom: 17px;
            }

            .event-section-heading h2 {
                font-size: 24px;
            }

            .event-archive-grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }

            .event-archive-card {
                min-height: 0;
                padding: 21px 20px;
            }

            .event-archive-card:last-child:nth-child(odd) {
                grid-column: auto;
                width: auto;
            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     共用 Header
===================================================== -->

<div id="site-header"></div>


<!-- =====================================================
     Breadcrumb
===================================================== -->

<nav id="breadcrumb"
     class="breadcrumb"
     aria-label="麵包屑">
</nav>


<main>


    <!-- =================================================
         年度標題
    ================================================= -->

    <section class="event-year-header">

        <div class="content-container">

            <h1 id="event-title">
                2025 友好拼布手作節
            </h1>

            <p id="event-header-subtitle"
               class="event-year-header-subtitle">
                青春之歌｜松菸1號倉庫＋文創大街
            </p>

        </div>

    </section>



    <!-- =================================================
         主視覺＋介紹
    ================================================= -->

    <section class="event-overview">

        <div class="content-container">

            <article class="event-overview-card">

                <div class="event-overview-image">

                    <img id="event-image"
                         src="/events/2025/2025.jpg"
                         alt="2025 友好拼布手作節－青春之歌">

                </div>


                <div class="event-overview-content">

                    <p class="event-overview-kicker">
                        Song of Youth
                    </p>

                    <h2 id="event-overview-title">
                        青春之歌
                    </h2>

                    <p id="event-description">
                    </p>

                    <ul id="event-facts"
                        class="event-facts">
                    </ul>

                </div>

            </article>

        </div>

    </section>



    <!-- =================================================
         作品展
    ================================================= -->

    <section class="event-exhibition">

        <div class="content-container">

            <div class="event-section-heading">

                <p class="event-section-label">
                    Exhibition
                </p>

                <h2>
                    作品展
                </h2>

            </div>


            <article class="event-exhibition-card">

                <div class="event-exhibition-content">

                    <p id="exhibition-description"
                       class="event-exhibition-description">
                    </p>

                    <a id="exhibition-link"
                       href="/events/2025/exhibition/"
                       class="event-exhibition-button">

                        瀏覽作品展 →

                    </a>

                </div>


                <div class="event-exhibition-image">

                    <img id="exhibition-image"
                         src="/events/2025/exhibition.jpg"
                         alt="2025 友好拼布手作節作品展">

                </div>

            </article>

        </div>

    </section>



    <!-- =================================================
         活動內容
    ================================================= -->

    <section class="event-archive">

        <div class="content-container">

            <div class="event-section-heading">

                <p class="event-section-label">
                    Event Archive
                </p>

                <h2>
                    活動內容
                </h2>

            </div>


            <div id="event-section-list"
                 class="event-archive-grid">

                <!-- JS 自動產生 -->

            </div>

        </div>

    </section>



    <!-- =================================================
         返回歷年活動
    ================================================= -->

    <section class="event-return-banner">

        <div class="content-container">

            <a href="/events/"
               class="event-return-banner-link"
               aria-label="返回歷年活動">

                <img
                    src="/events/2025/event-footer.jpg"
                    alt="2025 友好拼布手作節－青春之歌，臺北松山文創園區1號倉庫與文創大街">

            </a>

            <p class="event-return-hint">
                點擊圖片返回歷年活動
            </p>

        </div>

    </section>


</main>


<!-- =====================================================
     共用 Footer
===================================================== -->

<div id="site-footer"></div>


<!-- =====================================================
     JavaScript
===================================================== -->

<script src="/assets/js/include.js"></script>


<script>

    window.breadcrumbData = [

        {
            title: "首頁",
            url: "/"
        },

        {
            title: "歷年活動",
            url: "/events/"
        },

        {
            title: "2025 友好拼布手作節"
        }

    ];

</script>


<script src="/assets/js/breadcrumb.js"></script>


<!-- 2025 DATA -->
<script src="/events/2025/event-data.js"></script>


<script>

(function () {

    "use strict";


    if (
        typeof eventData === "undefined" ||
        !eventData
    ) {

        console.error(
            "eventData 資料不存在"
        );

        return;

    }


    /* =====================================================
       基本資料
    ===================================================== */

    const eventTitle =
        document.getElementById(
            "event-title"
        );

    const eventSubtitle =
        document.getElementById(
            "event-header-subtitle"
        );

    const eventImage =
        document.getElementById(
            "event-image"
        );

    const eventOverviewTitle =
        document.getElementById(
            "event-overview-title"
        );

    const eventDescription =
        document.getElementById(
            "event-description"
        );


    if (eventTitle) {
        eventTitle.textContent =
            eventData.title || "";
    }


    if (eventSubtitle) {
        eventSubtitle.textContent =
            eventData.subtitle || "";
    }


    if (eventImage) {

        eventImage.src =
            eventData.image || "";

        eventImage.alt =
            eventData.title || "2025 友好拼布手作節";

    }


    if (eventOverviewTitle) {
        eventOverviewTitle.textContent =
            "青春之歌";
    }


    if (eventDescription) {
        eventDescription.textContent =
            eventData.description || "";
    }


    /* =====================================================
       活動資訊
    ===================================================== */

    const factsContainer =
        document.getElementById(
            "event-facts"
        );


    if (
        factsContainer &&
        Array.isArray(eventData.facts)
    ) {

        eventData.facts.forEach(
            function (item) {

                const li =
                    document.createElement(
                        "li"
                    );

                const label =
                    document.createElement(
                        "span"
                    );

                label.className =
                    "event-facts-label";

                label.textContent =
                    item.label || "";


                const value =
                    document.createElement(
                        "span"
                    );

                value.className =
                    "event-facts-value";

                value.textContent =
                    item.value || "";


                li.appendChild(label);
                li.appendChild(value);

                factsContainer.appendChild(li);

            }
        );

    }


    /* =====================================================
       作品展
    ===================================================== */

    if (eventData.exhibition) {

        const exhibitionImage =
            document.getElementById(
                "exhibition-image"
            );

        const exhibitionDescription =
            document.getElementById(
                "exhibition-description"
            );

        const exhibitionLink =
            document.getElementById(
                "exhibition-link"
            );


        if (exhibitionImage) {

            exhibitionImage.src =
                eventData.exhibition.image || "";

            exhibitionImage.alt =
                (eventData.exhibition.title || "作品展");

        }


        if (exhibitionDescription) {

            exhibitionDescription.textContent =
                eventData.exhibition.description || "";

        }


        if (exhibitionLink) {

            exhibitionLink.href =
                eventData.exhibition.url || "#";

        }

    }



    /* =====================================================
       活動內容卡片
    ===================================================== */

    const sectionList =
        document.getElementById(
            "event-section-list"
        );


    if (
        sectionList &&
        Array.isArray(eventData.sections)
    ) {

        eventData.sections.forEach(
            function (item) {

                const article =
                    document.createElement(
                        "article"
                    );

                article.className =
                    "event-archive-card";


                const label =
                    document.createElement(
                        "p"
                    );

                label.className =
                    "event-archive-label";

                label.textContent =
                    item.englishTitle || "";


                const title =
                    document.createElement(
                        "h3"
                    );

                title.textContent =
                    item.title || "";


                const description =
                    document.createElement(
                        "p"
                    );

                description.className =
                    "event-archive-description";

                description.textContent =
                    item.description || "";


                const link =
                    document.createElement(
                        "a"
                    );

                link.className =
                    "event-archive-link";

                link.href =
                    item.url || "#";

                link.textContent =
                    "查看內容 →";


                article.appendChild(label);
                article.appendChild(title);
                article.appendChild(description);
                article.appendChild(link);

                sectionList.appendChild(article);

            }
        );

    }


})();

</script>


</body>

</html>
