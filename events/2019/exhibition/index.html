<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>2019 作品展｜台灣國際拼布友好會 TIQA</title>

    <meta name="description"
          content="台灣國際拼布友好會 2019 年作品展紀錄">

    <!-- 全站共用 CSS -->
    <link rel="stylesheet"
          href="/assets/css/style.css">

    <!-- 作品展共用 CSS -->
    <link rel="stylesheet"
          href="/assets/css/event-gallery.css">
    <script src="/assets/js/head-common.js"></script>
</head>


<body>


    <!-- =====================================================
         共用 Header
    ===================================================== -->

    <div id="site-header"></div>

    <!-- =====================================================
         Breadcrumb
    ===================================================== -->

    <nav id="breadcrumb"
         class="breadcrumb"
         aria-label="麵包屑">
    </nav>

    <!-- =====================================================
         Main
    ===================================================== -->

    <main>


        <!-- =================================================
             Page Hero
        ================================================= -->

        <section class="event-gallery-hero">

            <div class="content-container">

                <h1 id="event-gallery-title">
                    2019 作品展
                </h1>

                <p id="event-gallery-subtitle">
                    Exhibition 2019
                </p>

            </div>

        </section>



        <!-- =================================================
             Intro
        ================================================= -->

        <section class="event-gallery-intro">

            <div class="content-container">

                <div class="event-gallery-heading">

                    <p class="event-gallery-label">
                        Exhibition Archive
                    </p>

                    <h2>
                        展覽作品
                    </h2>

                </div>


                <p id="event-gallery-description"
                   class="event-gallery-description">
                    台灣國際拼布友好會 2019 年作品展紀錄
                </p>

            </div>

        </section>



        <!-- =================================================
             Gallery
             由 event-gallery.js 依 gallery-data.js 產生
        ================================================= -->

        <section class="event-gallery-section">

            <div class="content-container">

                <div id="event-gallery-list"
                     class="event-gallery-grid">

                    <!-- JS 自動產生 -->

                </div>

            </div>

        </section>


    </main>



    <!-- =====================================================
         Lightbox
    ===================================================== -->

    <div id="gallery-lightbox"
         class="gallery-lightbox"
         hidden
         aria-hidden="true">

        <div class="gallery-lightbox-backdrop"
             data-lightbox-close></div>


        <div class="gallery-lightbox-dialog"
             role="dialog"
             aria-modal="true"
             aria-labelledby="gallery-lightbox-title">


            <!-- 關閉 -->

            <button type="button"
                    id="gallery-lightbox-close"
                    class="gallery-lightbox-close"
                    aria-label="關閉圖片瀏覽">
                ×
            </button>



            <!-- 圖片區 -->

            <div class="gallery-lightbox-image-wrap">

                <img id="gallery-lightbox-image"
                     src=""
                     alt="">

            </div>



            <!-- 作品資料 -->

            <div class="gallery-lightbox-info">

                <h2 id="gallery-lightbox-title">
                </h2>

                <p id="gallery-lightbox-artist"
                   class="gallery-lightbox-artist">
                </p>

                <p id="gallery-lightbox-count"
                   class="gallery-lightbox-count">
                </p>

            </div>



            <!-- 上一張 / 下一張 -->

            <div class="gallery-lightbox-controls">

                <button type="button"
                        id="gallery-lightbox-prev"
                        class="gallery-lightbox-button">
                    ← 上一件
                </button>

                <button type="button"
                        id="gallery-lightbox-next"
                        class="gallery-lightbox-button">
                    下一件 →
                </button>

            </div>


        </div>

    </div>



    <!-- =====================================================
         共用 Footer
    ===================================================== -->

    <div id="site-footer"></div>



    <!-- =====================================================
         JavaScript
    ===================================================== -->
    <!-- 共用 Header / Footer -->
    <script src="/assets/js/include.js"></script>

    <!-- Breadcrumb DATA -->
    <script>
        window.breadcrumbData = [

            {
                title: "首頁",
                url: "/"
            },

            {
                title: "歷年活動",
                url: "/events/"
            },

            {
                title: "2019 作品展"
            }

        ];
    </script>

    <!-- 共用 Breadcrumb -->
    <script src="/assets/js/breadcrumb.js"></script>


    <!-- 2019 年作品資料 -->
    <script src="/events/2019/gallery-data.js"></script>

    <!-- 作品展共用功能 -->
    <script src="/events/event-gallery.js"></script>


</body>

</html>
