<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>2019 友好拼布手作節｜台灣國際拼布友好會 TIQA</title>
    <meta name="description"
          content="2019 友好拼布手作節於台北松山文創園區二號倉庫舉辦，包含展覽、課程、活動門票、出版紀念集、名師工作坊、作品徵件、台灣拼布大賽、市集及志工等歷史活動資料。">

    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/events.css">
    <script src="/assets/js/head-common.js"></script>
</head>

<body>

<div id="site-header"></div>

<nav id="breadcrumb"
     class="breadcrumb"
     aria-label="麵包屑">
</nav>

<main>

    <!-- 年度標題 -->
    <section class="event2019-year-header">
        <div class="content-container">
            <h1 id="event-title">2019 友好拼布手作節</h1>
            <p id="event-header-subtitle"
               class="event2019-year-subtitle">
                台北松山文創園區二號倉庫
            </p>
        </div>
    </section>


    <!-- 主視覺＋活動資訊 -->
    <section class="event2019-overview">
        <div class="content-container">

            <article class="event2019-overview-card">

                <div class="event2019-overview-image">
                    <img id="event-image"
                         src="/events/2019/2019.jpg"
                         alt="2019 友好拼布手作節">
                </div>

                <div class="event2019-overview-content">

                    <p class="event2019-kicker">
                        Taiwan Friendly Quilt &amp; Craft Festival 2019
                    </p>

                    <h2>2019 友好拼布手作節</h2>

                    <p id="event-description"
                       class="event2019-description">
                    </p>

                    <ul id="event-facts"
                        class="event2019-facts">
                    </ul>

                </div>

            </article>

        </div>
    </section>


    <!-- 作品展 -->
    <section class="event2019-exhibition">
        <div class="content-container">

            <div class="event2019-section-heading">
                <p class="event2019-section-label">Exhibition</p>
                <h2>作品展</h2>
            </div>

            <article class="event2019-exhibition-card">

                <div class="event2019-exhibition-content">

                    <p id="exhibition-description"
                       class="event2019-exhibition-description">
                    </p>

                    <a id="exhibition-link"
                       href="/events/2019/exhibition/"
                       class="event2019-button">
                        瀏覽作品展 →
                    </a>

                </div>

                <div class="event2019-exhibition-image">
                    <img id="exhibition-image"
                         src="/events/2019/exhibition.jpg"
                         alt="2019 友好拼布手作節作品展">
                </div>

            </article>

        </div>
    </section>


    <!-- 活動紀錄：原選單全部攤平 -->
    <section class="event2019-archive">
        <div class="content-container">

            <div class="event2019-section-heading">
                <p class="event2019-section-label">Event Archive</p>
                <h2>活動紀錄</h2>
            </div>

            <div id="event-section-list"
                 class="event2019-archive-grid">
            </div>

        </div>
    </section>


    <!-- 返回歷年活動 -->
    <section class="event-return-banner">
        <div class="content-container">

            <a href="/events/"
               class="event-return-banner-link"
               aria-label="返回歷年活動">

                <img src="/events/2019/event-footer.jpg"
                     alt="2019 友好拼布手作節">

            </a>

            <p class="event-return-hint">
                點擊圖片返回歷年活動
            </p>

        </div>
    </section>

</main>

<div id="site-footer"></div>

<script src="/assets/js/include.js"></script>

<script>
window.breadcrumbData = [
    { title: "首頁", url: "/" },
    { title: "歷年活動", url: "/events/" },
    { title: "2019 友好拼布手作節" }
];
</script>

<script src="/assets/js/breadcrumb.js"></script>
<script src="/events/2019/event-data.js"></script>

<script>
(function () {

    "use strict";

    if (typeof eventData === "undefined" || !eventData) {
        console.error("eventData 資料不存在");
        return;
    }

    const eventTitle = document.getElementById("event-title");
    const eventSubtitle = document.getElementById("event-header-subtitle");
    const eventImage = document.getElementById("event-image");
    const eventDescription = document.getElementById("event-description");

    if (eventTitle) eventTitle.textContent = eventData.title || "";
    if (eventSubtitle) eventSubtitle.textContent = eventData.subtitle || "";

    if (eventImage) {
        eventImage.src = eventData.image || "";
        eventImage.alt = eventData.title || "";
    }

    if (eventDescription) {
        eventDescription.textContent = eventData.description || "";
    }

    const factsContainer = document.getElementById("event-facts");

    if (factsContainer && Array.isArray(eventData.facts)) {
        eventData.facts.forEach(function (item) {
            const li = document.createElement("li");
            const label = document.createElement("span");
            const value = document.createElement("span");

            label.className = "event2019-facts-label";
            value.className = "event2019-facts-value";

            label.textContent = item.label || "";
            value.textContent = item.value || "";

            li.appendChild(label);
            li.appendChild(value);
            factsContainer.appendChild(li);
        });
    }

    if (eventData.exhibition) {
        const exhibitionImage = document.getElementById("exhibition-image");
        const exhibitionDescription = document.getElementById("exhibition-description");
        const exhibitionLink = document.getElementById("exhibition-link");

        if (exhibitionImage) {
            exhibitionImage.src = eventData.exhibition.image || "";
        }

        if (exhibitionDescription) {
            exhibitionDescription.textContent = eventData.exhibition.description || "";
        }

        if (exhibitionLink) {
            exhibitionLink.href = eventData.exhibition.url || "#";
        }
    }

    const sectionList = document.getElementById("event-section-list");

    if (sectionList && Array.isArray(eventData.sections)) {
        eventData.sections.forEach(function (item) {
            const article = document.createElement("article");
            article.className = "event2019-archive-card";

            const label = document.createElement("p");
            label.className = "event2019-archive-label";
            label.textContent = item.englishTitle || "";

            const title = document.createElement("h3");
            title.textContent = item.title || "";

            const description = document.createElement("p");
            description.className = "event2019-archive-description";
            description.textContent = item.description || "";

            article.appendChild(label);
            article.appendChild(title);
            article.appendChild(description);

            if (item.date) {
                const date = document.createElement("p");
                date.className = "event2019-archive-date";
                date.textContent = item.date;
                article.appendChild(date);
            }

            const link = document.createElement("a");
            link.className = "event2019-archive-link";
            link.href = item.url || "#";
            link.textContent = "查看內容 →";

            article.appendChild(link);
            sectionList.appendChild(article);
        });
    }

})();
</script>

</body>
</html>
