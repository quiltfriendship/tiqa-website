<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>聯絡我們｜台灣國際拼布友好會 TIQA</title>

    <meta name="description"
          content="台灣國際拼布友好會聯絡資訊與聯絡表單">

    <!-- 全站共用 CSS -->
    <link rel="stylesheet"
          href="/assets/css/style.css">

    <!-- 聯絡我們專用 CSS -->
    <link rel="stylesheet"
          href="/assets/css/contact.css">
    <script src="/assets/js/head-common.js"></script>
</head>


<body>


<!-- =====================================================
     Header
===================================================== -->

<div id="site-header"></div>

<!-- =====================================================
     Main
===================================================== -->

<main>


    <!-- 頁面標題 -->

    <section class="contact-hero">

        <div class="content-container">

            <h1>
                聯絡我們
            </h1>

            <p>
                Contact Us
            </p>

        </div>

    </section>



    <!-- 聯絡資訊 + 表單 -->

    <section class="contact-page">

        <div class="content-container">

            <div class="contact-layout">


                <!-- =================================================
                     左側聯絡資訊
                ================================================= -->

                <section class="contact-info">

                    <h2>
                        台灣國際拼布友好會
                    </h2>

                    <p class="contact-info-en">
                        Taiwan International Quilt Association
                    </p>


                    <div class="contact-info-list">

                        <div class="contact-info-item">

                            <h3>Email</h3>

                            <p>
                                <a href="mailto:quiltfriendship@gmail.com">
                                    quiltfriendship@gmail.com
                                </a>
                            </p>

                        </div>


                        <div class="contact-info-item">

                            <h3>
                                聯絡說明
                            </h3>

                            <p>
                                如有活動、會員、出版或其他相關問題，
                                歡迎透過聯絡表單或電子郵件與我們聯絡。
                            </p>

                        </div>

                    </div>

                </section>



                <!-- =================================================
                     右側聯絡表單
                ================================================= -->

                <section class="contact-form-section">

                    <h2>
                        聯絡表單
                    </h2>

                    <p class="form-note">
                        請填寫以下資料，我們將於收到訊息後儘速回覆。
                    </p>


                    <form id="contact-form"
                          class="contact-form"
                          novalidate>


                        <!-- Web3Forms -->

                        <input type="hidden"
                               name="access_key"
                               value="2d3c7f03-706f-4f79-ac2a-3595692c851d">

                        <input type="hidden"
                               name="subject"
                               value="TIQA 官網－聯絡我們">

                        <input type="hidden"
                               name="from_name"
                               value="TIQA 官網聯絡表單">


                        <!-- Honeypot 防垃圾訊息 -->

                        <div class="botcheck"
                             aria-hidden="true">

                            <label>
                                請勿填寫此欄位
                                <input type="checkbox"
                                       name="botcheck"
                                       tabindex="-1"
                                       autocomplete="off">
                            </label>

                        </div>



                        <!-- 姓名 -->

                        <div class="form-group">

                            <label for="contact-name">

                                姓名

                                <span class="required">
                                    *
                                </span>

                            </label>

                            <input
                                type="text"
                                id="contact-name"
                                name="name"
                                autocomplete="name"
                                maxlength="100"
                                required
                            >

                            <p class="form-error"
                               id="contact-name-error">
                            </p>

                        </div>



                        <!-- Email -->

                        <div class="form-group">

                            <label for="contact-email">

                                Email

                                <span class="required">
                                    *
                                </span>

                            </label>

                            <input
                                type="email"
                                id="contact-email"
                                name="email"
                                autocomplete="email"
                                maxlength="200"
                                required
                            >

                            <p class="form-error"
                               id="contact-email-error">
                            </p>

                        </div>



                        <!-- 聯絡事項 -->

                        <div class="form-group">

                            <label for="contact-message">

                                聯絡事項

                                <span class="required">
                                    *
                                </span>

                            </label>

                            <textarea
                                id="contact-message"
                                name="message"
                                rows="8"
                                maxlength="3000"
                                required
                            ></textarea>

                            <p class="form-help">
                                最多 3000 字。
                            </p>

                            <p class="form-error"
                               id="contact-message-error">
                            </p>

                        </div>



                        <!-- 同意 -->

                        <div class="form-group form-check">

                            <input
                                type="checkbox"
                                id="contact-consent"
                                name="consent"
                                value="已同意"
                                required
                            >

                            <label for="contact-consent">

                                我同意提供上述聯絡資料，
                                僅供本次聯絡與回覆使用。

                                <span class="required">
                                    *
                                </span>

                            </label>

                        </div>

                        <p class="form-error"
                           id="contact-consent-error">
                        </p>



                        <!-- 送出 -->

                        <div class="form-actions">

                            <button type="submit"
                                    id="contact-submit"
                                    class="contact-submit">

                                送出

                            </button>

                        </div>


                        <!-- 成功 / 失敗訊息 -->

                        <div id="contact-form-message"
                             class="contact-form-message"
                             role="status"
                             aria-live="polite">
                        </div>


                    </form>

                </section>


            </div>

        </div>

    </section>


</main>



<!-- =====================================================
     Footer
===================================================== -->

<div id="site-footer"></div>


<script src="/assets/js/include.js"></script>

<script src="/about/contact/contact.js"></script>


</body>
</html>
